<!DOCTYPE html>
<html>
<head>
    <title>CORS Test - Mixflow Signup</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        input, button { display: block; margin: 10px 0; padding: 10px; width: 100%; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Mixflow CORS Test</h1>
    <p>Testing signup API with CORS</p>
    
    <input type="text" id="name" placeholder="Name" value="Test User">
    <input type="email" id="email" placeholder="Email" value="">
    <input type="password" id="password" placeholder="Password" value="password123">
    <button onclick="testSignup()">Test Signup</button>
    
    <div id="result"></div>
    
    <script>
        // Generate unique email
        document.getElementById('email').value = 'test' + Date.now() + '@example.com';
        
        async function testSignup() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            resultDiv.className = '';
            
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: 'user'
            };
            
            try {
                console.log('Sending request to:', 'https://mixflow-backend.fly.dev/api/users');
                console.log('Data:', data);
                
                const response = await fetch('https://mixflow-backend.fly.dev/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                const result = await response.json();
                console.log('Response data:', result);
                
                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = '<strong>✅ SUCCESS!</strong><br>' + 
                        'Status: ' + response.status + '<br>' +
                        'Message: ' + result.message + '<br>' +
                        'User ID: ' + result.user.id + '<br>' +
                        'Email: ' + result.user.email;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = '<strong>❌ ERROR</strong><br>' + 
                        'Status: ' + response.status + '<br>' +
                        'Error: ' + (result.error || result.message);
                }
            } catch (error) {
                console.error('Fetch error:', error);
                resultDiv.className = 'error';
                resultDiv.innerHTML = '<strong>❌ FETCH ERROR</strong><br>' + 
                    'Error: ' + error.message + '<br>' +
                    'This usually means CORS preflight failed or network error.';
            }
        }
    </script>
</body>
</html>
